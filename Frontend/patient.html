
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>HealthCare Plus</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="patient.html">Patient Registration</a>
    </nav>
</header>

<section>
    <h2>Patient Registration</h2>

    <form id="patientForm">
        <input type="number" id="patientId"
               placeholder="Patient ID" required>

        <input type="text" id="patientName"
               placeholder="Patient Name" required>

        <input type="number" id="age"
               placeholder="Age" min="1" required>

        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <input type="tel" id="phone"
               placeholder="Phone Number" required>

        <input type="text" id="disease"
               placeholder="Disease" required>

        <button type="submit">Register Patient</button>
    </form>

    <p id="patientMessage"></p>



<div class="patient-list-section">

    <hr>
<h2>Patient List</h2>



</div>

    <hr>


<table border="1" cellpadding="10" cellspacing="0">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Disease</th>
        </tr>
    </thead>
    <tbody id="patientTableBody">
    </tbody>
</table>
</section>

<script src="patient.js"></script>
</body>
</html>
